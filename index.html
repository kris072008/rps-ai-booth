<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rock Paper Scissors vs AI · IET PSBA</title>
<style>
  :root{
    --blue:#0A1736; --blue-2:#060F24; --line:#1E386E;
    --purple:#8B5CF7; --green:#34D399;
    --text:#F5F5F5; --muted:#A0B0BE; --empty:#374660;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--blue-2); color:var(--text); min-height:100dvh;
    font-family:"Helvetica Neue",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    font-weight:300; display:flex; flex-direction:column; align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  header{
    width:100%; background:var(--blue); border-bottom:2px solid var(--purple);
    padding:14px 20px; display:flex; justify-content:space-between; align-items:center;
  }
  header h1{font-size:1rem; font-weight:500; letter-spacing:.01em}
  header p{font-size:.78rem; color:var(--muted); margin-top:2px}
  .score{display:flex; gap:22px; text-align:right}
  .score span{display:block; font-size:.68rem; color:var(--muted)}
  .score b{font-size:1.5rem; font-weight:500}
  .stage{
    position:relative; width:100%; max-width:720px; aspect-ratio:4/3;
    background:#000; overflow:hidden; margin-top:14px; border-radius:14px;
  }
  video,canvas{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1)}
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:6px;
    text-shadow:0 2px 12px rgba(0,0,0,.8); pointer-events:none; padding:20px;
    background:rgba(6,15,36,.25);
  }
  .rounds{position:absolute; top:14px; left:0; right:0; text-align:center; font-size:.8rem; color:var(--muted)}
  .dots{display:flex; gap:12px; justify-content:center; margin-top:6px}
  .dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--empty)}
  .dot.human{background:var(--green); border-color:var(--green)}
  .dot.ai{background:var(--purple); border-color:var(--purple)}
  .dot.tie{background:var(--muted); border-color:var(--muted)}
  .dot.now{outline:1px solid var(--text); outline-offset:3px}
  .big{font-size:clamp(2.4rem,11vw,4.6rem); font-weight:500; letter-spacing:-.01em}
  .mid{font-size:clamp(1rem,4.4vw,1.5rem)}
  .small{font-size:clamp(.8rem,3.4vw,1rem); color:var(--muted)}
  .says{color:var(--green); font-size:clamp(.9rem,3.8vw,1.15rem); max-width:92%; margin-top:10px; min-height:1.4em}
  footer{max-width:720px; padding:16px 20px 30px; text-align:center; font-size:.85rem; color:var(--muted); line-height:1.6}
  button{
    font:inherit; font-weight:500; background:var(--purple); color:#fff; border:0;
    border-radius:999px; padding:12px 28px; margin-top:16px; cursor:pointer;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>IET PSB Academy On Campus</h1>
    <p>Campus Club Fair 2026</p>
  </div>
  <div class="score">
    <div><span>AI</span><b id="aiScore">0</b></div>
    <div><span>Humans</span><b id="humanScore">0</b></div>
  </div>
</header>

<div class="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="draw"></canvas>
  <div class="rounds" id="rounds" hidden>
    <div id="roundLabel" hidden></div>
    <div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
  </div>
  <div class="overlay">
    <div class="mid" id="top"></div>
    <div class="big" id="big"></div>
    <div class="small" id="sub">Tap start, then show your hand</div>
    <div class="says" id="says"></div>
  </div>
</div>

<button id="start">Start camera</button>

<footer>
  Fist, palm or two fingers
</footer>

<script type="module">
import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const ROUNDS = 3, STEP = 1.0, CAPTURE_AT = 3 * STEP + 0.6;
const REVEAL_HOLD = 4.0, READY_GAP = 1.8, GAMEOVER_HOLD = 3.0, STABLE = 10;
const MOVES = ["rock","paper","scissors"];
const BEATS = {rock:"scissors", paper:"rock", scissors:"paper"};
const COUNTER = {rock:"paper", paper:"scissors", scissors:"rock"};

const IET_FACTS = [
  "The IET has over 157,000 engineering and technology members in 148 countries.",
  "The IET was formed in 2006 when the IEE and the IIE merged.",
  "Worldwide, the IET runs over 1,500 engineering events every year.",
  "IET Singapore runs lectures and technical visits, and most are free to attend.",
  "In 2024, IET Singapore organised 29 events, about two and a half every month.",
  "IET Singapore visits real engineering sites, like rail depots and manufacturing centres.",
  "IET Singapore has a Young Professionals Section for early career engineers.",
  "IET PSBA has already held two events this year, with a third coming soon.",
  "On 1 October, IET PSBA visits the Hyundai Motor Group Innovation Centre Singapore.",
  "The 1 October industry visit has only 15 places, so sign up early.",
  "IET PSBA's annual general meeting featured a sharing session on the marine industry.",
  "At our AGM, members learned how AI is used in the marine industry.",
  "IET PSBA invited four speakers from different engineering fields to meet students.",
  "Our four speakers shared advances in their industries and their work experience.",
];
let deck = [];
function nextFact(used){
  for (let pass = 0; pass < 2; pass++){
    if (!deck.length){ deck = [...IET_FACTS].sort(() => Math.random() - .5); }
    while (deck.length){ const f = deck.pop(); if (!used.has(f)){ used.add(f); return f; } }
  }
  return "";
}

/* The AI: order 2 Markov model over the player's move history */
class PatternAI {
  constructor(eps = 0.12){ this.eps = eps; this.hist = []; this.t = [new Map(),new Map(),new Map()]; this.why = "warming up"; }
  #key(o){ return this.hist.slice(this.hist.length - o).join("|"); }
  predict(){
    if (Math.random() < this.eps){ this.why = "mixing it up"; return MOVES[Math.floor(Math.random()*3)]; }
    for (const o of [2,1,0]){
      if (this.hist.length < o) continue;
      const c = this.t[o].get(this.#key(o)); if (!c) continue;
      const total = [...c.values()].reduce((a,b)=>a+b,0);
      if (total < (o ? 2 : 3)) continue;
      const guess = [...c.entries()].sort((a,b)=>b[1]-a[1])[0][0];
      this.why = `you often play ${guess} here`;
      return COUNTER[guess];
    }
    this.why = "warming up";
    return MOVES[Math.floor(Math.random()*3)];
  }
  observe(m){
    for (const o of [0,1,2]){
      if (this.hist.length < o) continue;
      const k = this.#key(o);
      if (!this.t[o].has(k)) this.t[o].set(k, new Map());
      const c = this.t[o].get(k); c.set(m, (c.get(m)||0)+1);
    }
    this.hist.push(m);
  }
}

const TIPS=[8,12,16,20], PIPS=[6,10,14,18];
function classify(lm){
  const span = Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y) || 1e-6, margin = span * 0.15;
  const ext = TIPS.map((t,i)=> (lm[PIPS[i]].y - lm[t].y) > margin);
  const n = ext.filter(Boolean).length, [a,b,c,d] = ext;
  if (n === 0) return "rock";
  if (a && b && !c && !d) return "scissors";
  if (n >= 3) return "paper";
  return null;
}
const outcome = (h,a) => h === a ? "tie" : (BEATS[h] === a ? "human" : "ai");

/* speech through the browser, if available */
function say(text){
  if (!text || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.rate = 1.0;
  speechSynthesis.speak(u);
}

const $ = id => document.getElementById(id);
const video = $("cam"), canvas = $("draw"), ctx = canvas.getContext("2d");
const top_ = $("top"), big = $("big"), sub = $("sub"), says = $("says");
const dots = [...document.querySelectorAll(".dot")];

let ai = new PatternAI(), aiGames = 0, humanGames = 0;
let state = "attract", t0 = 0, waitFrom = 0, stable = [], landmarker = null;
let round = 1, hw = 0, aw = 0, results = [], used = new Set();
let lockedHuman = null, lockedAI = null, why = "", result = null;

function speak(line){ says.textContent = line; say(line); }
function newGame(){ ai = new PatternAI(); round = 1; hw = aw = 0; results = []; used = new Set(); }
function drawRounds(showNow = true){
  $("rounds").hidden = false;
  $("roundLabel").textContent = `Round ${Math.min(round, ROUNDS)} of ${ROUNDS}`;
  dots.forEach((d, i) => {
    d.className = "dot" + (i < results.length ? " " + results[i] : "") +
      (showNow && i === results.length ? " now" : "");
  });
}
function steady(move){
  stable.push(move); if (stable.length > STABLE) stable.shift();
  return stable.length === STABLE && stable[0] && stable.every(m => m === stable[0]);
}
function startCountdown(now){ lockedAI = ai.predict(); why = ai.why; state = "counting"; t0 = now; stable = []; }

$("start").addEventListener("click", async (e) => {
  e.target.disabled = true; e.target.textContent = "Loading";
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions:{ modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
    numHands:1, runningMode:"VIDEO"
  });
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" } });
  await video.play();
  e.target.remove();
  requestAnimationFrame(loop);
});

function loop(ts){
  if (video.readyState >= 2){
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const res = landmarker.detectForVideo(video, ts);
    let move = null;
    if (res.landmarks?.length){
      const lm = res.landmarks[0]; move = classify(lm);
      ctx.fillStyle = "#34D399";
      for (const p of lm){ ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, 5, 0, 7); ctx.fill(); }
    }
    tick(move, performance.now()/1000);
  }
  requestAnimationFrame(loop);
}

function tick(move, now){
  big.style.color = "";
  if (state === "attract"){
    $("rounds").hidden = true;
    top_.textContent = "";
    big.textContent = "Rock Paper Scissors"; big.style.color = "var(--purple)";
    sub.textContent = "Show your hand to play";
    if (steady(move)){ newGame(); says.textContent = ""; startCountdown(now); }
  }
  else if (state === "waiting"){
    drawRounds(); top_.textContent = ""; big.textContent = "";
    if (now - waitFrom < READY_GAP){ sub.textContent = `Round ${round}`; stable = []; }
    else {
      sub.textContent = "Show your hand";
      if (steady(move)) startCountdown(now);
    }
  }
  else if (state === "counting"){
    drawRounds();
    const el = now - t0, words = ["Rock","Paper","Scissors","Shoot"], i = Math.min(Math.floor(el/STEP), 3);
    top_.textContent = ""; big.textContent = words[i];
    big.style.color = i === 3 ? "var(--green)" : "var(--purple)";
    sub.textContent = "";
    if (el >= CAPTURE_AT){
      if (!move){ state = "waiting"; waitFrom = now; says.textContent = "Try again"; return; }
      lockedHuman = move; result = outcome(lockedHuman, lockedAI); ai.observe(lockedHuman);
      results.push(result);
      if (result === "ai") aw++; else if (result === "human") hw++;
      speak({human:"Nice one.", ai:"I saw that coming.", tie:"A draw. We picked the same."}[result]);
      state = "reveal"; t0 = now;
    }
  }
  else if (state === "reveal"){
    drawRounds();
    const map = { human:["You win","var(--green)"], ai:["AI wins","var(--purple)"], tie:["Draw","var(--muted)"] };
    top_.textContent = "";
    big.textContent = map[result][0]; big.style.color = map[result][1];
    sub.textContent = `AI played ${lockedAI}`;
    if (now - t0 > REVEAL_HOLD){
      if (round >= ROUNDS){
        if (hw > aw) humanGames++; else if (aw > hw) aiGames++;
        $("aiScore").textContent = aiGames; $("humanScore").textContent = humanGames;
        speak({human:"You beat me. Well played.", ai:"I win this one. Thanks for playing.", tie:"A draw. Nicely matched."}
              [hw > aw ? "human" : aw > hw ? "ai" : "tie"]);
        setTimeout(() => speak(nextFact(used)), 2800);
        state = "gameover"; t0 = now;
      } else {
        if (round === 1) setTimeout(() => speak(nextFact(used)), 1200);
        round++; state = "waiting"; waitFrom = now; stable = [];
      }
    }
  }
  else if (state === "gameover"){
    drawRounds(false);
    top_.textContent = "";
    const r = hw > aw ? ["You beat the AI","var(--green)"] : aw > hw ? ["The AI wins","var(--purple)"] : ["It is a draw","var(--muted)"];
    big.textContent = r[0]; big.style.color = r[1];
    sub.textContent = `${hw}  to  ${aw}`;
    if (now - t0 > GAMEOVER_HOLD){ state = "attract"; stable = []; }
  }
}
</script>
</body>
</html>
